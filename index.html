<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cake Detective Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a detective "case file" console for a projected 40-minute lesson — a top rail of 5 timed stages,
   a halftone desk with witness statements, a six-suspect lineup, the CAM-9 AI camera terminal and drawing cards,
   and a bench below with Robo, the stage timer and agency points. */
:root{
  --paper:#EEF3FA; --paper-2:#E1E9F5; --card:#FFFFFF; --card-2:#F6F9FD;
  --ink:#141E33; --ink-2:#4C5B73; --line:#C8D4E6; --edge:#1D2A44; --dot:rgba(20,30,51,.07);
  --accent:#2B5BFF; --accent-deep:#1B3BB8; --accent-ink:#FFFFFF; --accent-soft:#E2E9FF;
  --hot:#FF4D6D; --hot-soft:#FFE3E9;
  --gold:#E3A400; --gold-soft:#FFF2C6;
  --ok:#11864B; --ok-soft:#DBF4E6; --bad:#D3304C; --bad-soft:#FCE1E6; --warn:#C46400;
  --t1:#E2459A; --t2:#2B6FEA; --t3:#14965A; --t4:#D18200;
  --t1-soft:#FDE3F0; --t2-soft:#E0EBFE; --t3-soft:#DAF3E6; --t4-soft:#FCEED2;
  --shadow:0 1px 0 rgba(20,30,51,.05),0 12px 28px -16px rgba(20,30,51,.4);
  --f-display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --fs-title:clamp(26px,3.1vw,50px); --fs-big:clamp(18px,1.65vw,27px); --fs-body:clamp(15px,1.06vw,18px); --fs-small:clamp(12.5px,.86vw,14.5px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1526; --paper-2:#152238; --card:#18263D; --card-2:#1D2E48;
    --ink:#E8EEF8; --ink-2:#A3B2C8; --line:#2C3F5C; --edge:#3E557A; --dot:rgba(232,238,248,.05);
    --accent:#7B96FF; --accent-deep:#4D63C9; --accent-ink:#0B1222; --accent-soft:#223258;
    --hot:#FF7A92; --hot-soft:#43202C; --gold:#FFC93D; --gold-soft:#3A3116;
    --ok:#45D08B; --ok-soft:#14382A; --bad:#FF6F86; --bad-soft:#41202B; --warn:#FFA43D;
    --t1:#FF6EB1; --t2:#5E9AFF; --t3:#3FCB83; --t4:#FFB43A;
    --t1-soft:#3E1F31; --t2-soft:#1C2E4E; --t3-soft:#173A2A; --t4-soft:#3D3016;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1526; --paper-2:#152238; --card:#18263D; --card-2:#1D2E48;
  --ink:#E8EEF8; --ink-2:#A3B2C8; --line:#2C3F5C; --edge:#3E557A; --dot:rgba(232,238,248,.05);
  --accent:#7B96FF; --accent-deep:#4D63C9; --accent-ink:#0B1222; --accent-soft:#223258;
  --hot:#FF7A92; --hot-soft:#43202C; --gold:#FFC93D; --gold-soft:#3A3116;
  --ok:#45D08B; --ok-soft:#14382A; --bad:#FF6F86; --bad-soft:#41202B; --warn:#FFA43D;
  --t1:#FF6EB1; --t2:#5E9AFF; --t3:#3FCB83; --t4:#FFB43A;
  --t1-soft:#3E1F31; --t2-soft:#1C2E4E; --t3-soft:#173A2A; --t4-soft:#3D3016;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
html,body{height:100%}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:18px 18px;color:var(--ink);font-family:var(--f-body);font-size:var(--fs-body);line-height:1.45;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.kz{display:none}
.show-kz .kz{display:inline}
.show-kz .kz.block{display:block}

/* ---------- frame ---------- */
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.topbar{min-width:0;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--card);border-bottom:2px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap;line-height:1}
.brand svg{width:34px;height:34px}
.rail{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-block:2px}
.rail-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:3px 9px 4px;font-size:12px;line-height:1.2;color:var(--ink-2);position:relative}
.rail-btn b{font-family:var(--f-display);font-weight:700;font-size:13.5px;color:var(--ink)}
.rail-btn small{font-family:var(--f-mono);font-size:10.5px}
.rail-btn::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px;background:var(--phase,transparent)}
.rail-btn[data-phase="start"]{--phase:var(--t3)} .rail-btn[data-phase="middle"]{--phase:var(--t2)} .rail-btn[data-phase="end"]{--phase:var(--t1)}
.rail-btn .pt{display:inline-block;margin-left:5px;font-family:var(--f-mono);font-size:9.5px;font-weight:600;background:var(--gold);color:#2A1E00;border-radius:999px;padding:0 5px;line-height:14px;vertical-align:1px}
.rail-btn.done{opacity:.75} .rail-btn.done b::before{content:"✓ ";color:var(--ok)}
.rail-btn.current{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .rail-btn.current b{color:var(--accent-ink)}
.clock{font-family:var(--f-mono);font-size:13px;white-space:nowrap;padding:5px 10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line)}
.clock.behind{color:var(--warn);border-color:var(--warn)}
.icon-btn{border:1px solid var(--line);background:var(--card-2);border-radius:10px;min-width:38px;height:36px;padding:0 9px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.icon-btn:hover{border-color:var(--accent)}
main#stage{overflow-y:auto;overflow-x:hidden;position:relative;padding-inline:16px}
.slide{max-width:1380px;margin-inline:auto;padding-block:16px 30px;display:grid;gap:16px;align-content:start}
.slide-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px}
.slide-head .titles{flex:1 1 300px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.slide-title{font-family:var(--f-display);font-weight:800;font-size:var(--fs-title);line-height:1.02;margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}
.lead{font-size:var(--fs-big);color:var(--ink-2);margin:0;max-width:64ch}
.obs-banner{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r-m);padding:10px 14px;font-weight:700}

/* ---------- controls ---------- */
.btn{border:2px solid transparent;border-radius:14px;padding:10px 18px;font-weight:800;font-size:var(--fs-body);display:inline-flex;align-items:center;gap:8px;line-height:1.1;transition:transform .1s ease,box-shadow .1s ease}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{box-shadow:0 2px 0 var(--accent-deep)}
.btn.secondary{background:var(--card);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.btn.secondary:hover{border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.big{padding:13px 24px;font-size:var(--fs-big)}
.btn.ai{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 var(--edge)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:var(--fs-body)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.muted{color:var(--ink-2)} .star{color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:inline-flex;flex-wrap:wrap;gap:6px;background:var(--paper-2);padding:5px;border-radius:16px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 14px;font-weight:800}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:var(--shadow)}

/* ---------- cards ---------- */
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow);min-width:0}
.hcard{background:var(--card);border:2px solid var(--edge);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative;box-shadow:0 4px 0 var(--edge)}
.hcard > span{display:block}
.hcard .label{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--card-2);border-bottom:2px solid var(--line)}
.hcard > span.label{display:flex}
.hcard .art{display:grid;place-items:center;padding:4px;background:radial-gradient(circle at 50% 70%,var(--accent-soft),transparent 70%)}
.hcard > span.art{display:grid}
.hcard .art svg{width:100%;height:100%;max-height:100%}
.hcard .name{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big);text-align:center;padding:2px 8px 8px;line-height:1.1}
.hcard .stats{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);padding:0 10px 10px;display:grid;gap:2px}
button.hcard{padding:0;text-align:inherit;cursor:pointer;transition:transform .12s ease}
button.hcard:hover{transform:translateY(-3px)}
button.hcard:active{transform:translateY(2px);box-shadow:0 2px 0 var(--edge)}
.badge{position:absolute;top:32px;right:8px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--gold);color:#2A1E00;font-weight:800;font-family:var(--f-mono);display:grid;place-items:center;font-size:14px}
.hcard > span.badge{display:grid}
.grid{display:grid;gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.good{animation:pop .45s ease} .wrong{animation:shake .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.is-right{border-color:var(--ok)!important;box-shadow:0 0 0 4px var(--ok-soft),0 4px 0 var(--ok)!important}
.is-wrong{border-color:var(--bad)!important;box-shadow:0 0 0 4px var(--bad-soft),0 4px 0 var(--bad)!important}
.note{border-radius:var(--r-m);padding:10px 14px;background:var(--paper-2);border:1px solid var(--line)}
.note.ok{background:var(--ok-soft);border-color:var(--ok)} .note.bad{background:var(--bad-soft);border-color:var(--bad)}

/* ---------- descriptors (points) ---------- */
.desc{border:2px solid var(--gold);background:var(--gold-soft);border-radius:var(--r-l);padding:12px 14px;display:grid;gap:8px}
.desc-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center}
.desc-head b{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.drow .pts{font-family:var(--f-mono);font-weight:600;font-size:12px;background:var(--gold);color:#2A1E00;border-radius:8px;padding:3px 7px;white-space:nowrap}
.drow p{margin:0;font-weight:700}
.drow .kz{font-weight:600;color:var(--ink-2);font-size:13px}
.ticks{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tick{border:2px solid var(--tc);background:var(--card);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;color:var(--ink);min-width:44px}
.tick[aria-pressed="true"]{background:var(--tc);color:var(--card)}
.tick[aria-pressed="true"]::before{content:"✓ "}

/* ---------- AI box (every slide) ---------- */
.aibox{border:2px solid var(--ink);border-radius:var(--r-l);background:var(--card);overflow:hidden}
.aibox > summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 14px;background:var(--ink);color:var(--paper)}
.aibox > summary::-webkit-details-marker{display:none}
.aibox > summary .ttl{font-family:var(--f-display);font-weight:800;font-size:17px;margin-right:4px}
.aibox > summary .pill{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700}
.aibox > summary .open-hint{margin-left:auto;font-family:var(--f-mono);font-size:12px;opacity:.85}
.aibox[open] > summary .open-hint::after{content:" ▲"} .aibox:not([open]) > summary .open-hint::after{content:" ▼"}
.ai-list{display:grid;gap:10px;padding:12px 14px}
.ai-item{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:6px 14px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.ai-item:last-child{border-bottom:0;padding-bottom:0}
.ai-item .tool b{font-family:var(--f-display);font-weight:800;font-size:16px;display:block;line-height:1.15}
.ai-item .tool span{font-size:12.5px;color:var(--ink-2)}
.ai-item .what{margin:0 0 6px;font-weight:700}
.prompt{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:0;max-height:340px;overflow:auto}
.pw{display:grid;gap:4px;min-width:0}
.pw-bar{display:flex;align-items:center;gap:8px;min-width:0}
.pw-bar .copy-st{flex:1;min-width:0;font-size:12px;color:var(--ok);font-weight:800}
.pw-bar .tag{white-space:normal;min-width:0}
.copy{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:800;margin-left:auto}
.copy:hover{border-color:var(--accent)}
.ai-item .tool a{display:block;font-size:12.5px;word-break:break-all;margin-top:2px}
.ai-st{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 8px;border:1px solid var(--line);line-height:1.3}
.ai-st.st-made{background:var(--ok-soft);border-color:var(--ok)}
.ai-st.st-live{background:var(--accent-soft);border-color:var(--accent)}
.ai-st.st-prompt{background:var(--gold-soft);border-color:var(--gold)}
.ai-pill{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--ink);color:var(--paper)}

/* ---------- bench ---------- */
.bench{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--card);border-top:2px solid var(--line);position:relative;z-index:6;flex-wrap:wrap}
.robo-dock{display:flex;align-items:center;gap:8px;position:relative}
.robo-face{width:52px;height:52px;border:0;background:transparent;padding:0}
.robo-face svg{width:100%;height:100%}
.robo-face .mouth{transform-origin:50% 50%;transform-box:fill-box}
.talking .robo-face .mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.4)}}
.caption{position:absolute;left:0;bottom:calc(100% + 12px);width:max-content;max-width:min(560px,calc(100vw - 32px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:16px;font-weight:700;font-size:var(--fs-body);box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.caption.show{opacity:1;transform:none}
.caption::after{content:"";position:absolute;left:22px;bottom:-7px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.timer{display:flex;align-items:center;gap:10px;min-width:0}
.timer .t-name{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.timer .t-val{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:4.6ch}
.timer .t-val.over{color:var(--bad)}
.tbar{width:120px;height:8px;border-radius:8px;background:var(--paper-2);overflow:hidden;border:1px solid var(--line)}
.tbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s linear}
.tbar i.over{background:var(--bad)}
.scores{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.sc{display:flex;align-items:center;gap:6px;border-radius:999px;border:2px solid var(--tc);background:var(--tcs);padding:4px 12px;font-weight:800;font-size:14px}
.sc .sc-val{font-family:var(--f-mono);font-weight:600;font-size:17px}
.sc .sc-val small{font-size:12px;color:var(--ink-2)}
.sc.active{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--tc)}
.nav{display:flex;gap:8px}

/* ---------- drawers ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:2px solid var(--line);z-index:20;box-shadow:-20px 0 40px -20px rgba(0,0,0,.35);display:flex;flex-direction:column}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;flex:1}
.drawer .body{overflow:auto;padding:16px;display:grid;gap:16px;align-content:start}
.drawer label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
.drawer textarea,.drawer input[type=text],.drawer select{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:8px 10px}
.drawer .hint{font-size:13px;color:var(--ink-2);margin-top:4px}
.notes-body h3{font-family:var(--f-display);font-weight:800;margin:0 0 4px;font-size:19px}
.notes-body p,.notes-body li{margin:0 0 6px}
.notes-body ul{padding-left:18px;margin:0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* ---------- cover ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:center}
.cover h1{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,6.6vw,108px);line-height:.88;margin:6px 0 12px;letter-spacing:-.02em;text-wrap:balance}
.cover h1 .w2{color:var(--accent)}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.lineup3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.qrbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;border:2px solid var(--line);border-radius:var(--r-l);background:var(--card);padding:10px 12px;margin-top:14px}
.qrbox svg,.qrbox img{width:118px;height:118px;display:block;background:#fff;border-radius:8px;padding:6px}
.qrbox b{font-family:var(--f-display);font-weight:800;font-size:18px;display:block}
.qrbox code{font-family:var(--f-mono);font-size:11.5px;word-break:break-all;color:var(--ink-2)}
.powers{display:flex;flex-wrap:wrap;gap:6px}
.power{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card);font-size:13px;font-weight:700}

/* ---------- mood / teams ---------- */
.mood-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mood-grid .art{height:clamp(110px,16vh,175px)}
.moodbar{display:flex;height:22px;border-radius:999px;overflow:hidden;border:1px solid var(--line);background:var(--paper-2)}
.moodbar i{display:block;height:100%}
.frame-line{font-family:var(--f-display);font-size:var(--fs-big);font-weight:700}
.frame-line u{text-decoration:none;border-bottom:3px dashed var(--accent);padding:0 18px}
.team-cols{display:grid;gap:14px}
.team-col{border:2px solid var(--tc);background:var(--tcs);border-radius:var(--r-l);padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.team-col header{display:flex;align-items:center;gap:10px}
.team-col header > span{width:84px;height:84px;flex:0 0 auto;display:block}
.team-col header > span svg{width:100%;height:100%}
.team-col h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:var(--fs-big);line-height:1}
.members{display:flex;flex-wrap:wrap;gap:6px}
.member{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;animation:drop .4s both}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}

/* ---------- lead-in ---------- */
.prompt-line{font-family:var(--f-mono);font-size:clamp(14px,1.25vw,20px);background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;min-height:2.6em;word-break:break-word}
.prompt-line .adj{color:var(--gold);font-weight:600}
.reveal{border:3px dashed var(--accent);border-radius:var(--r-l);padding:14px 18px;background:var(--accent-soft)}
.reveal h2{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,3.4vw,54px);line-height:1}
.objs{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.objs li{display:flex;gap:10px;align-items:baseline;font-size:var(--fs-big)}
.objs .lvl{font-family:var(--f-mono);font-size:14px;color:var(--gold);min-width:3.6ch}

/* ---------- vocabulary ---------- */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vcard{display:grid;grid-template-rows:auto auto;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 6px 8px;text-align:center;min-width:0}
.vcard .pic{height:110px;display:grid;place-items:center}
.vcard .pic svg{width:100%;height:100%}
.vcard b{font-family:var(--f-display);font-weight:800;font-size:clamp(16px,1.3vw,21px);line-height:1.1}
.vcard .kz{font-size:12.5px;color:var(--ink-2)}
.vcard .acts{display:flex;justify-content:center;gap:6px;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--card-2);border-radius:999px;min-width:34px;height:30px;font-size:14px;font-weight:800;padding:0 8px}
.memory{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.mcard{aspect-ratio:5/4;border:0;padding:0;background:transparent;perspective:900px;min-width:0}
.mcard .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--edge);overflow:hidden}
.mcard .back{background:var(--accent);color:var(--accent-ink)}
.mcard .back .num{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,2.6vw,44px)}
.mcard .front{background:var(--card);transform:rotateY(180deg);padding:4px}
.mcard .front b{font-family:var(--f-display);font-weight:800;font-size:clamp(16px,1.5vw,24px);line-height:1.05;text-align:center}
.mcard .front .pic{width:82%;height:82%}
.mcard .front .pic svg{width:100%;height:100%}
.mcard.matched .front{border-color:var(--ok);background:var(--ok-soft)}
.turn{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}

/* ---------- grammar ---------- */
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rule{background:var(--card);border:2px solid var(--line);border-radius:var(--r-m);padding:12px;display:grid;gap:6px;align-content:start}
.rule.challenge{border:2px dashed var(--gold);background:var(--gold-soft)}
.rule h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:var(--fs-big);line-height:1.05}
.ex{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.25vw,20px);line-height:1.2}
.ex .y{color:var(--ok)} .ex .n{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.quiz{display:grid;gap:10px}
.robo-wrote{font-family:var(--f-display);font-size:clamp(20px,2vw,32px);font-weight:700;background:var(--card-2);border:2px solid var(--line);border-radius:16px;padding:10px 16px;line-height:1.2}
.robo-wrote .err{text-decoration:underline wavy var(--bad);text-underline-offset:6px}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;text-align:left;font-weight:800;font-size:var(--fs-big);box-shadow:0 3px 0 var(--line)}
.opt:hover{border-color:var(--accent)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--ok)} .dots i.cur{background:var(--accent)}

/* ---------- listening ---------- */
.lineup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lineup .art{height:clamp(130px,21vh,230px)}
.transcript{font-family:var(--f-display);font-size:var(--fs-big);font-weight:600;line-height:1.3}

/* ---------- brain break ---------- */
.bb{display:grid;place-items:center;gap:14px;text-align:center;padding-block:10px}
.bb .emo{font-size:clamp(90px,14vw,190px);line-height:1}
.bb .cmd{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6vw,96px);line-height:1}

/* ---------- roll & describe ---------- */
.roll{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.62fr) minmax(0,1fr);gap:14px;align-items:center}
.cards6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{aspect-ratio:1/1;border:0;padding:0;background:transparent;perspective:1000px;min-width:0}
.tcard .in{display:block;position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.tcard.open .in{transform:rotateY(180deg)}
.tcard .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;border:2px solid var(--edge);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.tcard .back{background:var(--card)}
.tcard .back .bk{width:58%;height:62%}
.tcard .back .num{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2vw,30px);line-height:1}
.tcard .front{background:var(--gold-soft);transform:rotateY(180deg);text-align:center;border-color:var(--gold)}
.tcard .front .bk{width:44%;height:46%}
.tcard .front p{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(13px,1.1vw,18px);line-height:1.15}
.tcard.used:not(.open) .back{opacity:.35}
.tcard.flash .face{box-shadow:0 0 0 4px var(--accent)}
.bk svg{width:100%;height:100%;display:block}
.dice-wrap{display:grid;justify-items:center;gap:12px}
.dice{width:min(118px,100%);aspect-ratio:1}
.dice.spin{animation:spin .9s cubic-bezier(.3,.7,.4,1)}
.dice.show-hero{width:min(160px,100%);aspect-ratio:auto;height:190px}
.dice.show-hero svg{width:100%;height:100%}
@keyframes spin{from{transform:rotate(0) scale(.9)}to{transform:rotate(720deg) scale(1)}}
.task-big{font-family:var(--f-display);font-weight:800;font-size:clamp(19px,1.75vw,30px);line-height:1.12;text-align:center;text-wrap:balance}

/* ---------- hero lab ---------- */
.lab textarea{width:100%;min-height:112px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card-2);font-family:var(--f-display);font-weight:600;font-size:clamp(17px,1.45vw,23px);line-height:1.3;resize:vertical}
.lab textarea:focus{border-color:var(--accent);outline:none}
.bank{display:grid;gap:6px}
.bank-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bank-row .tag{min-width:7ch;text-align:center}
.bank .chip{font-size:14.5px;padding:3px 10px}
.genes{display:flex;flex-wrap:wrap;gap:6px}
.gene{font-family:var(--f-mono);font-size:12.5px;border-radius:8px;padding:3px 8px;border:1px solid var(--line);background:var(--card-2)}
.gene b{color:var(--accent);font-weight:600}
.coach{display:grid;gap:10px}
.stars{font-size:26px;letter-spacing:2px;color:var(--gold)}
.fix{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:8px 10px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)}
.fix .w{color:var(--bad);text-decoration:line-through} .fix .r{color:var(--ok);font-weight:800}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.shelf .art{height:170px}
.compare{font-family:var(--f-display);font-weight:600;font-size:var(--fs-big)}

/* ---------- assessment ---------- */
.podium{display:grid;gap:14px}
.pod{border:3px solid var(--tc);background:var(--tcs);border-radius:var(--r-l);padding:12px;display:grid;justify-items:center;gap:6px;position:relative}
.pod > span.hero{display:block;width:110px;height:120px}
.pod > span.hero svg{width:100%;height:100%}
.pod .pts{font-family:var(--f-mono);font-size:clamp(34px,3.8vw,60px);font-weight:600;line-height:1}
.pod .pts small{font-size:.45em;color:var(--ink-2)}
.pod .crown{position:absolute;top:-18px;font-size:34px}
.bars{display:grid;gap:4px;width:100%}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) 2.4em;gap:8px;align-items:center;font-size:12.5px;font-weight:700}
.bar > span:first-child{white-space:nowrap;min-width:7.2em}
.bar i{display:block;height:10px;border-radius:6px;background:var(--paper-2);overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--tc);border-radius:6px}
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.stu{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px}
.stu .nm{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .tm{font-size:11px;font-family:var(--f-mono);color:var(--ink-2)}
.stu .cnt{font-family:var(--f-mono);font-weight:600;min-width:4.5ch;text-align:center;font-size:16px}
.stu button{border:1px solid var(--line);background:var(--card-2);border-radius:50%;width:32px;height:32px;font-weight:800}
.crit{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.crit th,.crit td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.crit th{background:var(--paper-2);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.table-wrap{overflow-x:auto}

/* ---------- reflection / homework ---------- */
.cloud{min-height:220px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;padding:16px;border-radius:var(--r-l);background:var(--card-2);border:2px dashed var(--line)}
.cloud span{font-family:var(--f-display);font-weight:800;line-height:1;animation:drop .35s both}
.lights{display:grid;gap:10px}
.light-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.light-row p{margin:0;font-weight:700}
.tl{display:flex;gap:6px}
.tl button{border:2px solid var(--line);border-radius:12px;background:var(--card-2);min-width:56px;height:42px;font-family:var(--f-mono);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:5px}
.tl .dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.hw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hw .panel h3{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}
.hw .lvl{font-size:22px;color:var(--gold)}

/* ---------- appendix ---------- */
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tool-card{border:2px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:10px 12px;display:grid;gap:4px}
.tool-card b{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.1}
.tool-card .k{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.tool-card .st{font-size:13px;color:var(--ink-2)}

/* ---------- additions: toast, observer, inputs, sort game, lyrics, lab stats, appendix ---------- */
.toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-8px);background:var(--gold);color:#2A1E00;font-weight:800;padding:8px 16px;border-radius:999px;z-index:25;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.obs .timer,.obs .clock{display:none}
.task-tag{margin-left:8px;background:var(--gold);color:#2A1E00}
.txt{flex:1;min-width:140px;border:2px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--card)}
.txt:focus{border-color:var(--accent);outline:none}
.seg.wrap{flex-wrap:wrap;border-radius:16px}
.vcard button.pic{border:0;background:transparent;padding:0;width:100%;cursor:pointer}
.sortq{display:grid;gap:12px}
.sort-word{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,3.6vw,58px);line-height:1.05;text-align:center;padding:6px 0;overflow-wrap:anywhere}
.sort-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sort-opts .opt{text-align:center;font-size:var(--fs-body)}
.lyrics{white-space:pre-line;columns:2;column-gap:22px;font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.05vw,17px);line-height:1.3}
.lstats{display:flex;flex-wrap:wrap;gap:6px}
.lstat{font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-2)}
.lstat.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.split.wide-left{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.crit td.on,.crit td.off{text-align:center;font-weight:800}
.crit td.on{color:var(--ok)} .crit td.off{color:var(--ink-2)}
.crit tr.total td{background:var(--paper-2)}
.qr-ph{width:118px;height:118px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:8px;font-family:var(--f-mono)}
.qrbox.big{margin-top:0}
.qrbox.big svg{width:168px;height:168px}
.how{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.how-n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-family:var(--f-mono);font-size:14px}
.app-h{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big);margin:10px 0 0}
.app-sh{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.2}
.sc{cursor:pointer}

/* ---------- profile lab additions ---------- */
.los{display:grid;gap:4px;margin-top:14px}
.lo{font-size:13.5px;color:var(--ink-2)} .lo b{font-family:var(--f-mono);color:var(--ink);margin-right:4px}
.qcards{display:grid;gap:10px}
.qcard{border:2px solid var(--line);background:var(--card);border-radius:var(--r-l);padding:12px 14px;text-align:left;display:grid;gap:4px;box-shadow:0 3px 0 var(--line)}
.qcard:hover{border-color:var(--accent)}
.qcard .qtag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.qcard .qq{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big);line-height:1.15}
.qcard .qa{font-weight:700;font-size:var(--fs-body);color:var(--ink);background:var(--paper-2);border-radius:10px;padding:8px 10px}
.qcard .qhint{font-size:12px;color:var(--ink-2)}
.qcard.open .qhint{display:none}
.qcard.ai{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
.vcard{position:relative}
.pbadge{position:absolute;top:6px;right:6px;font-family:var(--f-mono);font-size:10px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px;z-index:1}
.charcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ccard{position:relative;display:grid;justify-items:center;text-align:center;gap:2px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 8px;min-width:0}
.ccard.pos{border-color:var(--ok)} .ccard.neg{border-color:var(--bad)}
.ccard .cemo{font-size:44px;line-height:1.1;border:0;background:transparent;padding:0}
.ccard b{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,1.3vw,21px)}
.ccard .cex{font-size:13px;color:var(--ink-2)}
.rules.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.og-phrase{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.2vw,34px)}
.og-slot{min-width:3.5em;text-align:center;border-bottom:3px dashed var(--accent);padding:0 6px;color:var(--ink-2)}
.og-slot.filled{color:var(--ink);border-bottom-style:solid}
.og-noun{color:var(--accent)}
.sortboard{display:grid;gap:10px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;align-items:center;padding:10px;border:2px dashed var(--line);border-radius:var(--r-m);background:var(--card-2)}
.wchip{border:2px solid var(--edge);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:800;font-size:clamp(15px,1.15vw,19px);box-shadow:0 3px 0 var(--edge);max-width:100%;overflow-wrap:anywhere}
.wchip.sel{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.wchip.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.wchip.bad{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.wchip small{font-weight:700;color:var(--ink-2);font-size:12px}
.scols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scol{border:2px solid var(--line);border-radius:var(--r-m);background:var(--card);display:grid;grid-template-rows:auto 1fr;min-height:150px;min-width:0;overflow:hidden}

.scol-h{border:0;border-bottom:2px solid var(--line);background:var(--paper-2);padding:8px;text-align:center;display:grid;gap:2px}
.scol.look .scol-h{background:var(--t2-soft)} .scol.char .scol-h{background:var(--t1-soft)}
.scol-h b{font-family:var(--f-display);font-weight:800;font-size:clamp(14px,1.05vw,17px);line-height:1.1}
.scol-h .drop{font-size:12px;color:var(--accent);font-weight:800;min-height:1em}
.scol-b{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;padding:8px}
.sets-all{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.set-col{border:2px solid var(--tc);border-radius:var(--r-m);padding:8px 10px;background:var(--card);display:grid;gap:4px}
.sit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.sit-pic{display:block;width:110px;height:110px}
.sit-pic svg{width:100%;height:100%}
.sit-text{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,1.9vw,30px);line-height:1.2}
.sit-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sit-opts .opt{text-align:center}
.lineup6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.lineup6 .art{height:clamp(130px,20vh,210px)}
.traits{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;padding:0 6px 8px}
.hcard > span.traits{display:flex}
.trait{border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--card-2);font-weight:800;font-size:14px}
.secret{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center;border:3px solid var(--gold);background:var(--gold-soft);border-radius:var(--r-l);padding:12px}
.secret-art{display:block;height:clamp(220px,38vh,340px)}
.secret-art svg{width:100%;height:100%}
.secret-l{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3vw,46px);line-height:1}
.secret .traits{justify-content:flex-start;padding:6px 0 0}
.secret .trait{font-size:18px;padding:3px 12px}
.idframe{margin:0;padding-left:22px;display:grid;gap:4px;font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.2vw,19px)}
.idframe u{text-decoration:none;border-bottom:2px dashed var(--accent);padding:0 6px;color:var(--accent)}
.idframe .muted{font-family:var(--f-body);font-size:12.5px}
.tally{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.tally-n{font-family:var(--f-mono);font-size:15px;min-width:5.5ch;text-align:center}
.tally-n b{font-size:18px}
.tally-n small{color:var(--ink-2)}
.mypts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;border:3px dashed var(--accent);border-radius:var(--r-l);background:var(--accent-soft);padding:12px 16px;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,1.7vw,26px)}
.mypts b{font-family:var(--f-mono);font-weight:600;background:var(--card);border-radius:10px;padding:2px 10px}
.mypts .tot{background:var(--accent);color:var(--accent-ink)}
.exit321{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.e3{border:2px solid var(--line);border-radius:var(--r-l);background:var(--card);padding:14px;display:grid;gap:4px;justify-items:start}
.e3 b{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,5vw,72px);line-height:1;color:var(--accent)}
.e3 span{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}
.e3 small{color:var(--ink-2);font-size:14px}

/* ---------- cake detective agency ---------- */
.news{display:flex;align-items:stretch;border:2px solid var(--edge);border-radius:var(--r-m);overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--edge)}
.news-tag{flex:0 0 auto;background:var(--hot);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.08em;padding:10px 14px;display:flex;align-items:center;white-space:nowrap}
.news-text{padding:10px 14px;font-family:var(--f-display);font-weight:800;font-size:var(--fs-big);line-height:1.15;min-width:0;align-self:center}
.scene{border:2px solid var(--edge);border-radius:16px;overflow:hidden;background:#E8F0FA}
.scene svg{width:100%;height:auto;display:block}
.case-brief{display:grid;gap:10px;border-color:var(--hot)}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.role{border:2px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:10px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.role-e{font-size:34px;line-height:1.1}
.role b{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big);line-height:1.1}
.role p{margin:4px 0 0;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:8px 10px;min-width:0}
.step b{font-family:var(--f-display);font-weight:800}
.witnesses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stmt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:var(--r-l);padding:10px 12px;min-width:0}
.stmt-pic{display:block;width:84px;height:84px;border-radius:50%;background:var(--accent-soft);overflow:hidden}
.stmt-pic svg{width:100%;height:100%;display:block}
.stmt-body{display:grid;gap:4px;min-width:0;justify-items:start}
.stmt-who{font-size:var(--fs-small)}
.stmt-text{margin:0;font-family:var(--f-display);font-weight:700;font-size:var(--fs-big);line-height:1.22}
.clue{border-radius:6px;transition:background .2s,box-shadow .2s}
.clue-a{background:var(--t2-soft);box-shadow:0 0 0 2px var(--t2);padding:0 4px}
.clue-c{background:var(--t1-soft);box-shadow:0 0 0 2px var(--t1);padding:0 4px}
.evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ev-col{border:2px solid var(--t2);background:var(--t2-soft);border-radius:var(--r-m);padding:10px 14px;min-width:0}
.ev-col.c{border-color:var(--t1);background:var(--t1-soft)}
.ev-col > b{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}
.ev-col ul{margin:6px 0 0;padding-left:22px;font-weight:800;font-size:var(--fs-big);display:grid;gap:2px}
.suspects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.suspects .art{height:clamp(120px,19vh,200px)}
.suspects .trait{font-size:13px}
.hcard.crossed .art{opacity:.28;filter:grayscale(1)}
.hcard.crossed::after{content:"✗";position:absolute;left:0;right:0;top:28px;bottom:40px;display:grid;place-items:center;font-size:clamp(64px,7vw,110px);font-weight:800;color:var(--bad);pointer-events:none;line-height:1}
.cam{border-color:var(--ink)}
.cam-title{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}
.cam-out{font-family:var(--f-mono);font-weight:500;font-size:clamp(15px,1.2vw,19px);background:#0B1222;color:#7CFFB2;border-radius:12px;padding:12px 14px;min-height:3.2em;word-break:break-word;border:2px solid #1D2A44}
.cam-out::before{content:"● REC  ";color:#FF4D6D}
.qa-log{display:grid;gap:6px;max-height:300px;overflow:auto}
.qa-row{border-left:5px solid var(--tc);background:var(--card-2);border-radius:8px;padding:6px 10px;font-size:var(--fs-small);display:grid;gap:2px}
.qa-q{font-weight:700} .qa-a{color:var(--ink-2)}
.qa-ok{color:var(--ok);font-weight:800} .qa-bad{color:var(--bad);font-weight:800}
.accuse{display:grid;gap:8px}
.acc-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;border-left:6px solid var(--tc);background:var(--card-2);border-radius:10px;padding:8px 12px}
.acc-row > b{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}
.acc-btn{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1}
.acc-btn:hover:not([disabled]){border-color:var(--tc)}
.acc-btn.on{background:var(--tc);border-color:var(--tc);color:var(--card)}
.acc-btn.thief{box-shadow:0 0 0 3px var(--ok)}
.acc-btn[disabled]{cursor:default}
.acc-btn[disabled]:not(.on):not(.thief){opacity:.45}
.reveal-box{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:center;border:3px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-l);padding:12px 16px}
.reveal-box .traits{justify-content:flex-start;padding:0}
.reveal-box .trait{font-size:18px;padding:3px 12px}
.caught{position:relative;display:block;height:clamp(220px,36vh,320px)}
.caught-art{display:block;height:100%}
.caught-art svg{width:100%;height:100%}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);border:5px solid #D3304C;color:#D3304C;font-family:var(--f-mono);font-weight:600;font-size:clamp(20px,2.2vw,32px);letter-spacing:.08em;padding:4px 12px;border-radius:10px;background:rgba(255,255,255,.82);white-space:nowrap;animation:stamp .5s ease both}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(1.5);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
.acard{border:3px solid var(--edge);border-radius:var(--r-l);background:var(--card);padding:16px 18px;display:grid;gap:8px;box-shadow:0 5px 0 var(--edge)}
.acard-text{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(24px,2.6vw,42px);line-height:1.12;text-wrap:balance}
.acard.hidden-card{justify-items:center;text-align:center;gap:4px;padding:22px;background:repeating-linear-gradient(45deg,var(--card-2) 0 14px,var(--paper-2) 14px 28px)}
.acard.hidden-card b{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}
.acard.mood{border-color:var(--t1);box-shadow:0 5px 0 var(--t1)}
.hints{margin:0;padding-left:24px;font-family:var(--f-display);font-weight:700;font-size:var(--fs-big);display:grid;gap:4px}
.mood-word{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3vw,46px);border:3px solid var(--t1);background:var(--t1-soft);border-radius:999px;padding:4px 18px;line-height:1.1}
.dlist{display:flex;flex-wrap:wrap;gap:6px}
.dlist .chip{font-size:var(--fs-body)}
.dlist span.chip{display:inline-block}
.chip.miss{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.match{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:var(--fs-big)}
.match b{font-family:var(--f-mono);font-size:clamp(30px,3.4vw,52px);font-weight:600;color:var(--ok);line-height:1}
.aa > summary{cursor:pointer;list-style:none}
.aa > summary::-webkit-details-marker{display:none}
.aa > summary b{font-family:var(--f-display);font-weight:800;font-size:var(--fs-big)}
.aa-text{width:100%;min-height:110px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card-2);font-family:var(--f-display);font-weight:600;font-size:clamp(16px,1.3vw,21px);line-height:1.3;resize:vertical}
.aa-text:focus{border-color:var(--accent);outline:none}
.two-up{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.wanted-frame{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.2vw,19px);line-height:1.35;background:var(--gold-soft);border:2px dashed var(--gold);border-radius:var(--r-m);padding:10px 12px}
.wanted-frame b{font-family:var(--f-mono);font-weight:600;color:var(--bad);letter-spacing:.1em}
.print-cards{display:grid;gap:10px}
.pcard{border:2px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:10px 14px;break-inside:avoid}
.pcard ol{margin:6px 0;padding-left:22px;display:grid;gap:3px}

/* ---------- criteria, tasks card ---------- */
.crit-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--card);border:2px dashed var(--gold);border-radius:12px;padding:8px 12px}
.crit-k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--card);background:var(--gold);border-radius:6px;padding:3px 8px;white-space:nowrap}
.crit-t{font-weight:800}
.crit-t .kz{font-weight:600;color:var(--ink-2);font-size:13px}
.crit-table td{vertical-align:top}
.crit-table{min-width:680px}
.crit-table .block,.muted.block{display:block}
.tasks-card{display:grid;gap:6px;margin-top:14px;border:2px solid var(--line);border-radius:var(--r-l);background:var(--card);padding:10px 12px}
.tk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:4px 2px;border-bottom:1px dashed var(--line)}
.tk b{font-family:var(--f-display);font-weight:800;font-size:17px}
.tk span{color:var(--ink-2);font-size:14px;min-width:0}
.tk .tk-pts{font-family:var(--f-mono);font-weight:600;font-size:13px;color:#2A1E00;background:var(--gold);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tk.total{border-bottom:0}
.tk.total .tk-pts{background:var(--accent);color:var(--accent-ink)}
@media (max-width:820px){ .crit-line{grid-template-columns:minmax(0,1fr)} .crit-k{justify-self:start} }

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .rules,.rules.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scols{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lineup6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .roll{grid-template-columns:minmax(0,1fr)}
  .dice-wrap{order:-1;grid-template-columns:auto 1fr;align-items:center;justify-items:start}
  .dice{width:100px}
}
@media (max-width:820px){
  .cover,.split{grid-template-columns:minmax(0,1fr)}
  .lineup,.hw{grid-template-columns:repeat(2,minmax(0,1fr))}
  .roster{grid-template-columns:minmax(0,1fr)}
  .memory{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mood-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lineup3{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ai-item{grid-template-columns:minmax(0,1fr)}
  .brand .bname{display:none}
  .timer .t-name{display:none}
  .tbar{width:70px}
  .scores{margin-left:0;order:3;width:100%}
  .team-cols,.podium{grid-template-columns:minmax(0,1fr)!important}
  .topbar{flex-wrap:wrap} .rail{order:9;flex:1 1 100%}
  .drow{grid-template-columns:auto minmax(0,1fr)} .drow .ticks{grid-column:1 / -1;justify-content:flex-start}
  .split.wide-left{grid-template-columns:minmax(0,1fr)}
  .scols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sit-opts,.exit321,.secret{grid-template-columns:minmax(0,1fr)}
  .secret-art{height:220px}
  .charcards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .drow .tally{grid-column:1 / -1;justify-content:flex-start}
  .sort-opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lyrics{columns:1}
  .toast{top:110px}
}
@media (max-width:520px){
  .rules,.rules.three,.hw{grid-template-columns:minmax(0,1fr)}
  .lineup6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sit{grid-template-columns:minmax(0,1fr)}
  .sit-pic{width:80px;height:80px}
  .cards6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock{display:none}
  .qrbox{grid-template-columns:auto minmax(0,1fr)}
  .qrbox svg{width:96px;height:96px}
  .qrbox.big{grid-template-columns:minmax(0,1fr);justify-items:start}
  .qrbox.big svg{width:150px;height:150px}
  .lineup3 .hcard .label > span + span{display:none}
  .lineup3 .art{height:150px!important}
  .bench{gap:8px;padding:6px 10px}
  .robo-face{width:40px;height:40px}
  .tbar{display:none}
  .timer{gap:6px}
  .timer .t-val{font-size:18px;min-width:3.6ch}
  .nav .btn{padding:8px 12px}
  .sc{padding:2px 9px;font-size:13px}
  .sc .sc-val{font-size:15px}
  .sc.active{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tc)}
  .slide-title{font-size:30px}
}
@media (max-width:1100px){
  .roles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps.four{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .witnesses,.reveal-box{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .caught{height:240px}
  .news{flex-direction:column}
  .news-tag{padding:6px 12px}
}
@media (max-width:520px){
  .suspects{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps,.steps.four{grid-template-columns:minmax(0,1fr)}
  .stmt-pic{width:60px;height:60px}
  .acc-btn{width:40px;height:40px;font-size:18px}
  .evidence{grid-template-columns:minmax(0,1fr)}
  .two-up{grid-template-columns:minmax(0,1fr)}
  .acard{padding:12px 14px}
}
@media print{
  html,body,#app{height:auto!important}
  #app{display:block}
  main#stage{overflow:visible;padding:0}
  .topbar,.bench,.drawer,#confetti,.toast,.aibox,.desc,.tabs,.btn{display:none!important}
  body{background:#fff}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="app">
  <header class="topbar">

          <rect x="52" y="24" width="5" height="12" rx="2" style="fill:var(--ink-2)"/>
          <circle cx="21" cy="26" r="7" fill="#fff" stroke-width="1.8" style="stroke:var(--ink)"/>
          <circle cx="39" cy="26" r="7" fill="#fff" stroke-width="1.8" style="stroke:var(--ink)"/>

const teamKey = (i) => 't' + (i + 1);
const T1 = TASKS[0];
function markOn(tid, d, team) { const m = S.marks[tid]; return !!(m && m[d] && m[d].includes(team)); }
function taskPoints(tid, team) { const t = TASKS.find((x) => x.id === tid); return t.descs.reduce((a, _, d) => a + (markOn(tid, d, team) ? 1 : 0), 0); }
function teamPoints(team) { return taskPoints('t1', team); }
function teams() { return S.teamNames.slice(0, S.teamCount).map((name, i) => ({ i, name, key: teamKey(i), pts: teamPoints(i) })); }
function setMark(tid, d, team, on) {
  if (!(team >= 0 && team < S.teamCount)) return false;
  const m = S.marks[tid] || (S.marks[tid] = []);
  if (!Array.isArray(m[d])) m[d] = [];
  const has = m[d].includes(team);
  if (on === has) return false;
  if (on) m[d].push(team); else m[d] = m[d].filter((x) => x !== team);
  save('marks'); refreshScores(); return true;
}
function award(tid, d, team) {
  const ok = setMark(tid, d, team, true);
  if (ok) {
    sfx.point(); toast(`+1 · ${S.teamNames[team]} Agency · D${d + 1}`);
    const chip = $('#sc' + team); if (chip) bump(chip, 'good');
  }
  return ok;
}
function tallyOf(tid, d) { const t = S.tallies[tid]; return (t && t[d]) || 0; }
function setTally(tid, d, delta) {
  const t = S.tallies[tid] || (S.tallies[tid] = []);
  t[d] = clamp((t[d] || 0) + delta, 0, 60); save('tallies');
  $$('[data-tally]').forEach((el) => { const [a, b] = el.dataset.tally.split(':'); el.textContent = String(tallyOf(a, +b)); });
  drawPointsTables();
}
let toastT = 0;
function toast(text) {
  const el = $('#toast'); if (!el) return;
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600);
}

const CHAR_WORDS = new Set([...CHAR.map((c) => c.w), ...Object.keys(CHAR_EXTRA)]);

const LOOK_EXTRA = new Set(['good-looking', 'well-built', 'curly-haired', 'straight-haired', 'long-haired', 'short-haired', 'fair-haired', 'dark-haired', 'red-haired', 'blue-eyed', 'brown-eyed', 'green-eyed', 'grey-eyed', 'smiling', 'freckles', 'glasses', 'beard', 'moustache', 'ponytail', 'plaits', 'fringe', 'dimples', 'bald', 'headphones', 'cap', 'hat', 'hoodie', 'jacket', 't-shirt']);
const PERSON_NOUNS = new Set('boy girl man woman person hero heroine friend kid child teacher brother sister mum dad mother father grandpa grandma granny uncle aunt cousin player student lady guy thief helper suspect'.split(' '));
const OPINION_EXTRA = new Set(['good-looking', 'beautiful', 'pretty', 'handsome', 'nice', 'lovely', 'cute', 'interesting', 'boring', 'amazing']);
const words = (text) => (String(text || '').toLowerCase().replace(/[’`]/g, "'").match(/[a-z]+(?:-[a-z]+)*/g) || []);
function adjRank(w) {
  if (CHAR_WORDS.has(w) || OPINION_EXTRA.has(w)) return 0;
  const a = HADJ[w]; if (!a) return null;
  if (a.cat === 'opinion' || a.cat === 'feeling') return 0;
  if (['size', 'height', 'build', 'length'].includes(a.cat)) return 1;
  if (a.cat === 'age') return 2;
  if (['shape', 'type'].includes(a.cat)) return 3;
  if (a.cat === 'colour') return 4;

}
function personOrderIssues(text) {
  const out = [];
  for (const ch of String(text || '').split(/[.!?;\n]+/)) {
    const t = words(ch);
    for (let i = 0; i < t.length; i++) {
      if (!PERSON_NOUNS.has(t[i])) continue;
      let k = i - 1; const seq = [];
      while (k >= 0 && (adjRank(t[k]) != null || t[k] === 'and')) { if (t[k] !== 'and') seq.unshift(t[k]); k--; }
      if (seq.length >= 2) {
        const ranks = seq.map(adjRank);
        if (!ranks.every((r, idx) => idx === 0 || r >= ranks[idx - 1])) {
          const sorted = seq.slice().sort((a, b) => adjRank(a) - adjRank(b));
          out.push({ wrong: `${seq.join(' ')} ${t[i]}`, right: `${sorted.join(' ')} ${t[i]}`, why: 'Order: opinion → size → age → shape → colour: a kind tall old man.' });
        }

  }
  return out;
}
function countAdjPhrases(text) {
  let n = 0;

    const t = words(ch);
    for (let i = 0; i < t.length; i++) {
      if (!(t[i] === 'hair' || t[i] === 'eyes' || t[i] === 'face' || PERSON_NOUNS.has(t[i]))) continue;
      let k = i - 1; let c = 0;
      while (k >= 0 && (adjRank(t[k]) != null || PART_SET.has(t[k]) || t[k] === 'and')) { if (t[k] !== 'and') c++; k--; }
      if (c >= 2) n++;

}
const COUNT_NOUNS = new Set(['hoodie', 'jacket', 't-shirt', 'tshirt', 'shirt', 'cap', 'hat', 'dress', 'sweater', 'jumper', 'moustache', 'beard', 'ponytail', 'fringe', 'face', 'nose', 'scarf', 'coat']);
const escRe = (x) => String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function capIssues(text) {

}
function articleIssues(text) {
  const out = [];
  // missing a / an: "wearing purple hoodie", "has got moustache and round face"
  for (const ch of String(text || '').split(/[.!?;\n]+/)) {
    const c = words(ch); let ctx = false;
    for (let i = 0; i < c.length - 1; i++) {
      if (['wearing', 'wears', 'got', 'has'].includes(c[i])) ctx = true; else if (!(c[i] === 'and' && ctx)) continue;
      if (c[i] === 'has' && c[i + 1] === 'got') continue;
      let k = i + 1; while (k < c.length && HADJ[c[k]] && !COUNT_NOUNS.has(c[k])) k++;
      if (k < c.length && COUNT_NOUNS.has(c[k])) {
        const seq = c.slice(i + 1, k + 1);
        out.push({ wrong: [c[i], ...seq].join(' '), right: [c[i], aOrAn(seq[0]), ...seq].join(' '), why: 'Use a / an with one thing: a purple hoodie, a moustache.' });
      }

    const nx = t[i + 1];
    if (HADJ[nx] || !(CHAR_WORDS.has(nx) || PART_SET.has(nx))) continue;
    const vowel = (/^[aeiou]/.test(nx) && !/^(uni|use|eu|one)/.test(nx)) || nx === 'honest';
    if (t[i] === 'a' && vowel) out.push({ wrong: `a ${nx}`, right: `an ${nx}`, why: 'Use an before a vowel sound: an honest boy.' });
    if (t[i] === 'an' && !vowel) out.push({ wrong: `an ${nx}`, right: `a ${nx}`, why: 'Use a before a consonant sound: a kind girl.' });

}

    h('h2', { class: 'app-h' }, `Қосымша 3 · Assessment criteria & descriptors · max ${MAX_POINTS} points`),
    h('div', { class: 'table-wrap' }, descTableStatic()),
    h('h2', { class: 'app-h' }, 'Қосымша 4 · Cards (басып шығаруға: жүктелген файлда Ctrl+P)'),
    cards,
    h('p', { class: 'note', style: 'margin:0' }, '🔒 ЖИ құралдарын мұғалім басқарады: көп құралдың жас шектеуі бар (13+ / 18+). Оқушы суретін ЖИ-ге жүктегенде бет-әлпеті емес, тек сурет түсіріледі; аты-жөні жазылмайды. ЖИ қателесуі мүмкін — соңғы шешімді мұғалім қабылдайды.'));
}

/* ================= lesson map: 7 timed stages (40 min) + appendix ================= */
const LESSON_MIN = 40;
const SLIDES = [
  { short: 'Start', title: 'Cake Detective Agency', mins: 0, kind: '', robo: "Hello, detectives! I'm Robo. Today we describe appearance and character. And we have a mystery!", render: renderCover },
  { short: 'Hello', title: 'How do you feel today?', mins: 1, phase: 'start', kind: 'Warm-up', robo: PR.hello, autoSay: true, render: renderHello },
  { short: 'Teams', title: 'Make the agencies', sub: 'Owl · Fox · Lynx — three detective agencies', mins: 1, phase: 'start', kind: 'Organisation', robo: PR.teams, autoSay: true, render: renderTeams },
  { short: 'News', title: 'Breaking news!', sub: 'Lead-in · appearance or character?', mins: 1.5, phase: 'start', kind: 'Lead-in', robo: PR.news, autoSay: true, render: renderLead },
  { short: 'Agency', title: 'Detective Agency: Who Stole the Cake?', sub: 'Group work · sort the clues, ask the AI camera, find the thief', mins: 16, phase: 'middle', kind: 'Group work', robo: 'Group work! You are detective agencies. Choose your roles: Chief Detective, Reader, Writer and Speaker. Read the witness statements and find the thief!', autoSay: true, render: renderCase },
  { short: 'Artist', title: 'Blind Artist & Mood Reporter', sub: 'Pair work · describe appearance, then character', mins: 11, phase: 'middle', kind: 'Pair work', robo: 'Pair work! Student A describes, Student B draws. Do not show the card! The Artist can ask only one question: Has he got…?', autoSay: true, render: renderArtist },
  { short: 'Wanted', title: 'WANTED: AI Sketch Artist', sub: 'Individual work · describe the helper so clearly that the AI can draw them', mins: 8, phase: 'middle', kind: 'Individual work', robo: 'Individual work! The thief had a helper. Look at the photo for ten seconds. Then write a WANTED poster: appearance and character.', autoSay: true, render: renderWanted, leave: () => { const ta = $('#wText'); if (ta) { S.lab.wanted = ta.value; save('lab'); } } },
  { short: 'Points', title: 'Points & reflection', mins: 1.5, phase: 'end', kind: 'Assessment', robo: "Let's count our points. Group, pair and me: ten points!", render: renderPoints },
  { short: 'AI', title: 'AI tools & prompts', mins: 0, kind: 'Appendix', appendix: true, render: renderAppendix }
];
(() => {
  let acc = 0;
  SLIDES.forEach((sl, i) => {
    sl.notes = N[i] || '';
    if (!i || sl.appendix) { sl.range = ''; return; }
    sl.startMin = acc; acc += sl.mins; sl.endMin = acc; sl.range = `${fmtMins(sl.startMin)}–${fmtMins(sl.endMin)}`;
  });
})();

/* ================= navigation, timers, drawers ================= */
let shown = -1; let userInteracted = false;
['pointerdown', 'keydown'].forEach((ev) => addEventListener(ev, () => { userInteracted = true; }, { once: true, capture: true }));
function go(i) {
  i = clamp(i, 0, SLIDES.length - 1);
  if (i === shown) return;
  if (shown >= 0 && SLIDES[shown].leave) SLIDES[shown].leave();
  stopSay();
  S.slide = i; store.set('slide', i);
  $$('#stage > .slide').forEach((s) => { s.hidden = true; });
  let el = document.getElementById(`slide-${i}`);
  if (!el) { el = h('section', { class: 'slide', id: `slide-${i}`, 'aria-label': SLIDES[i].title }); $('#stage').append(el); SLIDES[i].render(el); }
  el.hidden = false; shown = i; $('#stage').scrollTop = 0;
  renderRail(); renderNotes(); renderTimer(); updateNav();
  if (S.settings.autoVoice && SLIDES[i].autoSay && userInteracted) setTimeout(() => { if (shown === i) say(SLIDES[i].robo); }, 380);
}
function renderRail() {
  const rail = $('#rail'); rail.innerHTML = '';
  SLIDES.forEach((sl, i) => {
    const task = TASKS.find((t) => t.slide === i);
    rail.append(h('button', {
      class: 'rail-btn' + (i === S.slide ? ' current' : '') + (i && !sl.appendix && i < S.slide ? ' done' : ''), type: 'button', 'data-phase': sl.phase || null,
      'aria-current': i === S.slide ? 'step' : null, title: sl.title, onclick: () => go(i)
    }, h('b', {}, i === 0 ? 'Start' : sl.appendix ? '🤖 AI' : `${i}. ${sl.short}`), h('small', {}, i === 0 ? `${LESSON_MIN} min` : sl.appendix ? 'prompts' : sl.range, task ? h('span', { class: 'pt' }, `${task.descs.length} pt`) : null)));
  });
  const cur = rail.querySelector('.current');
  if (cur) { const left = cur.offsetLeft - rail.clientWidth / 2 + cur.clientWidth / 2; try { rail.scrollTo({ left: Math.max(0, left), behavior: reduceMotion() ? 'auto' : 'smooth' }); } catch (e) { rail.scrollLeft = Math.max(0, left); } }
}
function renderNotes() {
  const sl = SLIDES[S.slide]; const nb = $('#notesBody'); nb.innerHTML = '';
  nb.append(h('div', {}, h('div', { class: 'eyebrow' }, S.slide === 0 ? 'Сабаққа дайындық' : sl.appendix ? 'Қосымша' : `${S.slide}-кезең · ${sl.range} · ${fmtMins(sl.mins)} мин`), h('h3', {}, sl.title)));
  nb.append(h('div', { html: sl.notes }));
  const task = TASKS.find((t) => t.slide === S.slide);
  if (task) nb.append(h('div', { class: 'note' }, h('b', {}, `Task ${task.n} · ${task.descs.length} балл. `), h('b', {}, 'Критерий: '), task.critKz + '. ', h('br', {}), task.descs.map((d, i) => `D${i + 1} — ${d.kz}`).join('; ') + '.'));
  const items = AIX[S.slide] || [];
  if (items.length) nb.append(h('div', { class: 'row' }, h('span', { class: 'tag' }, 'ЖИ'), [...new Set(items.map((it) => TOOLS[it.t].name))].map((a) => h('span', { class: 'ai-pill' }, a))));
}
function updateNav() {
  $('#prevBtn').disabled = S.slide === 0;
  const nb = $('#nextBtn'); nb.disabled = S.slide === SLIDES.length - 1;
  nb.textContent = S.slide === 0 ? (OBS ? 'View ▶' : 'Start ▶') : 'Next ▶';
}
let running = false; let lastTick = performance.now(); const overDone = {};
function toggleRun(force) { running = typeof force === 'boolean' ? force : !running; lastTick = performance.now(); renderTimer(); }
function startLesson() { if (!OBS && !running) toggleRun(true); go(1); }
function renderTimer() {
  const sl = SLIDES[S.slide]; const plan = (sl.mins || 0) * 60000; const used = S.timers.stageMs[S.slide] || 0;
  const tv = $('#tVal'); const tb = $('#tBar');
  $('#tName').textContent = S.slide && !sl.appendix ? `${S.slide}. ${sl.short}` : (running ? 'Lesson running' : 'Ready');
  if (plan) {
    const left = plan - used; tv.textContent = left >= 0 ? fmt(left) : '+' + fmt(-left); tv.classList.toggle('over', left < 0);
    tb.style.width = Math.min(100, (used / plan) * 100) + '%'; tb.classList.toggle('over', left < 0);
    if (left < 0 && running && !overDone[S.slide]) { overDone[S.slide] = true; sfx.end(); }
  } else { tv.textContent = '—'; tv.classList.remove('over'); tb.style.width = '0%'; }
  const planEnd = S.slide && !sl.appendix ? sl.endMin * 60000 : LESSON_MIN * 60000;
  const clock = $('#clock'); clock.textContent = `${fmt(S.timers.lessonMs)} / ${LESSON_MIN}:00`;
  clock.classList.toggle('behind', S.slide > 0 && S.timers.lessonMs > planEnd + 30000);
  const pb = $('#playBtn'); pb.textContent = running ? '❚❚' : '▶'; pb.setAttribute('aria-label', running ? 'Pause timer' : 'Start timer');
}
setInterval(() => {
  const now = performance.now();
  if (running) { const dt = Math.min(5000, now - lastTick); S.timers.lessonMs += dt; S.timers.stageMs[S.slide] = (S.timers.stageMs[S.slide] || 0) + dt; }
  lastTick = now; renderTimer();
}, 500);
setInterval(() => { if (running) save('timers'); }, 5000);
function placeDrawers() {
  const tb = $('.topbar').getBoundingClientRect(); const bn = $('.bench').getBoundingClientRect();
  $$('.drawer').forEach((d) => { d.style.top = Math.max(0, Math.round(tb.bottom)) + 'px'; d.style.bottom = Math.max(0, Math.round(innerHeight - bn.top)) + 'px'; });
}
addEventListener('resize', placeDrawers);
function openDrawer(id) {
  closeDrawers(); placeDrawers(); $('#' + id).hidden = false;
  if (id === 'notes') $('#notesBtn').setAttribute('aria-pressed', 'true');
  if (id === 'settings') fillSettings();
}
function closeDrawers() { $$('.drawer').forEach((d) => { d.hidden = true; }); $('#notesBtn').setAttribute('aria-pressed', 'false'); }
function toggleDrawer(id) { if ($('#' + id).hidden) openDrawer(id); else closeDrawers(); }
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    const p = document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : null;
    if (p && p.catch) p.catch(() => showCaption('Толық экран бұл жерде қолжетімсіз — браузердің F11 пернесін қолданыңыз.'));
    else if (!p) showCaption('Толық экран бұл жерде қолжетімсіз.');
  } catch (e) { showCaption('Толық экран бұл жерде қолжетімсіз.'); }
}

/* ================= settings ================= */
const HOST_THEME = document.documentElement.getAttribute('data-theme');
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else if (HOST_THEME) document.documentElement.setAttribute('data-theme', HOST_THEME);
  else document.documentElement.removeAttribute('data-theme');
}
function applyKz() { document.documentElement.classList.toggle('show-kz', !!S.settings.kz); $('#kzBtn').setAttribute('aria-pressed', String(!!S.settings.kz)); }
function renderVoiceSelect() {
  const sel = $('#voiceSel'); if (!sel) return; sel.innerHTML = '';
  if (!tts.ok || !tts.voices.length) {
    sel.append(h('option', {}, tts.ok ? 'Ағылшын дауысы табылмады' : 'Браузер дауысты қолдамайды')); sel.disabled = true;
    $('#voiceHint').textContent = 'Edge немесе Chrome-да ашыңыз. Windows баптауларында ағылшын тілінің дауыс пакетін қосуға болады.';
    return;
  }
  sel.disabled = false;
  tts.voices.forEach((v) => sel.append(h('option', { value: v.name, selected: !!(tts.voice && v.name === tts.voice.name) }, `${v.name} (${v.lang})`)));
}
function renderAiStatus() {
  const n = $('#aiStatus'); if (!n) return; n.innerHTML = '';
  [
    OBS ? '👀 Бақылаушы нұсқасы: Claude мұнда іске қосылмайды; CAM-9, «✨ AI card» және AI Coach-ты мұғалім сынып нұсқасында Claude арқылы көрсетеді. Мұнда CAM-9-дың дайын ережелері мен Robo-ның офлайн тексерісі жұмыс істейді.'
      : aiState === 'ready' ? '✓ Claude: CAM-9 ЖИ камерасы, «✨ AI card», «✨ AI mood card» және AI Coach қосулы (сіздің claude.ai аккаунтыңыз арқылы; алғашқы сұрауда рұқсат сұралады).'
        : aiState === 'checking' ? '… Claude-ты тексеріп жатыр.' : '○ Claude бұл режимде жоқ — CAM-9 дайын ережелермен жауап береді, Robo офлайн тексереді, карточкалар дайын жиыннан алынады.',
    canListen ? '✓ 🎤 «AI artist» диктовкасы қолжетімді (микрофонға рұқсат беріңіз).' : '○ 🎤 диктовка тек жүктелген файлда (Chrome/Edge) жұмыс істейді.',
    tts.ok ? '✓ Robo дауысы (TTS) қолжетімді.' : '○ Бұл браузерде дауыс жоқ — Robo мәтінмен сөйлейді.'
  ].forEach((l) => n.append(h('div', {}, l)));
}
function fillSettings() {
  $('#clsName').value = S.settings.cls || '';
  $('#stuList').value = S.students.join('\n');
  $('#stuHint').hidden = !S.studentsAreExample;
  $$('#teamCountSeg [data-n]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === S.teamCount)));
  $('#rate').value = S.settings.rate; $('#optSound').checked = !!S.settings.sound; $('#optAuto').checked = !!S.settings.autoVoice;
  $$('#themeSeg [data-t]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === S.settings.theme)));
  renderVoiceSelect(); renderAiStatus();
}
function resetLesson() {
  store.clearLesson();
  Object.assign(S, { marks: {}, tallies: {}, accuse: {}, crossed: {}, caseNo: 0, revealed: false, asked: [], lab: {}, moods: {}, groups: null, lights: [[0, 0, 0], [0, 0, 0], [0, 0, 0]], timers: { lessonMs: 0, stageMs: {} }, activeTeam: 0 });
  running = false; Object.keys(overDone).forEach((k) => delete overDone[k]);
  stopCountdowns(); stopSay();
  $('#stage').innerHTML = ''; pickers.clear();
  showClues = false;
  Object.assign(art, { i: 0, card: null, shown: false, revealed: false, got: {}, mi: 0, mood: null, mShown: false, mRevealed: false });
  clearTimeout(wan.timer); Object.assign(wan, { i: 0, photo: false, timer: 0, compared: false, ai: null }); Object.assign(aaS, { text: '', spec: null });
  shown = -1; renderScores(); go(0); closeDrawers(); showCaption('Жаңа сабаққа дайын!');
}
function wireSettings() {
  $$('[data-close]').forEach((b) => b.addEventListener('click', closeDrawers));
  $('#notesBtn').addEventListener('click', () => toggleDrawer('notes'));
  $('#setBtn').addEventListener('click', () => toggleDrawer('settings'));
  $('#fsBtn').addEventListener('click', toggleFullscreen);
  $('#kzBtn').addEventListener('click', () => { S.settings.kz = !S.settings.kz; saveSettings(); applyKz(); });
  $('#prevBtn').addEventListener('click', () => go(S.slide - 1));
  $('#nextBtn').addEventListener('click', () => { if (S.slide === 0) startLesson(); else go(S.slide + 1); });
  $('#playBtn').addEventListener('click', () => toggleRun());
  $('#tReset').addEventListener('click', () => { S.timers.stageMs[S.slide] = 0; overDone[S.slide] = false; save('timers'); renderTimer(); });
  $('#roboFace').addEventListener('click', () => say(lastLine || SLIDES[S.slide].robo || "Hello! I'm Robo."));
  $('#voiceSel').addEventListener('change', (e) => { S.settings.voice = e.target.value; saveSettings(); tts.voice = tts.voices.find((v) => v.name === e.target.value) || tts.voice; say("Hi! I'm Robo."); });
  $('#rate').addEventListener('input', (e) => { S.settings.rate = parseFloat(e.target.value) || 0.92; saveSettings(); });
  $('#testVoice').addEventListener('click', () => say("Hello, detectives! I'm Robo. Tall, slim, kind and clever!"));
  $('#optSound').addEventListener('change', (e) => { S.settings.sound = e.target.checked; saveSettings(); });
  $('#optAuto').addEventListener('change', (e) => { S.settings.autoVoice = e.target.checked; saveSettings(); });
  $('#clsName').addEventListener('input', (e) => { S.settings.cls = e.target.value.trim().slice(0, 20); saveSettings(); const c = $('#coverCls'); if (c) c.textContent = clsLabel(); });
  let stuT = 0;
  $('#stuList').addEventListener('input', (e) => {
    clearTimeout(stuT);
    stuT = setTimeout(() => {
      const names = e.target.value.split(/\n|,/).map((x) => x.trim()).filter(Boolean).slice(0, 60);
      S.students = names.length ? names : EXAMPLE_STUDENTS.slice(); S.studentsAreExample = !names.length;
      save('students'); save('studentsAreExample'); $('#stuHint').hidden = !S.studentsAreExample;
      mixTeams(false); refreshStudentCount();
    }, 500);
  });
  $$('#teamCountSeg [data-n]').forEach((b) => b.addEventListener('click', () => setTeamCount(+b.dataset.n)));
  $$('#themeSeg [data-t]').forEach((b) => b.addEventListener('click', () => {
    S.settings.theme = b.dataset.t; saveSettings(); applyTheme();
    $$('#themeSeg [data-t]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.t === S.settings.theme)));
  }));
  $('#resetBtn').addEventListener('click', () => { $('#resetYes').hidden = false; $('#resetNo').hidden = false; });
  $('#resetNo').addEventListener('click', () => { $('#resetYes').hidden = true; $('#resetNo').hidden = true; });
  $('#resetYes').addEventListener('click', () => { $('#resetYes').hidden = true; $('#resetNo').hidden = true; resetLesson(); });
  document.addEventListener('keydown', (e) => {
    const t = e.target; const tag = (t && t.tagName) || '';
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (t && t.isContentEditable)) { if (e.key === 'Escape') t.blur(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); if (S.slide === 0) startLesson(); else go(S.slide + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(S.slide - 1); }
    else if (e.key === 'n' || e.key === 'N') toggleDrawer('notes');
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'p' || e.key === 'P') toggleRun();
    else if (e.key === 'Escape') closeDrawers();
  });
  document.addEventListener('ai-state', () => {
    const ready = aiState === 'ready';
    ['#aiCardBtn', '#aiMoodBtn'].forEach((sel) => { const b = $(sel); if (b) b.hidden = !ready; });
    const ab = $('#askBtn'); if (ab) ab.textContent = ready ? 'Ask (Claude)' : 'Ask';
    const cb = $('#wCoachBtn'); if (cb) cb.textContent = ready ? '🤖 AI Coach (Claude)' : '🤖 Robo check';
    const sb = $('#wSketchBtn'); if (sb) sb.textContent = ready ? '🤖 AI sketch (Claude)' : '🤖 Robo sketch';
    const db = $('#aaBtn'); if (db) db.textContent = ready ? '🤖 Draw (Claude)' : '🤖 Draw';
    renderAiStatus();
  });
}

function setTeamCount(n) {
  S.teamCount = n; store.set('teamCount', n); S.activeTeam = Math.min(S.activeTeam, n - 1);
  $$('#teamCountSeg [data-n]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === n)));
  $$('.ticks[data-tid]').forEach(fillTicks);
  mixTeams(false);
  refreshTeamPickers(); refreshScores();
}
function refreshStudentCount() {
  $$('.tally-n small').forEach((el) => { el.textContent = ` / ${S.students.length}`; });
  drawPointsTables();
}

/* ================= boot ================= */
document.body.append(h('div', { class: 'toast', id: 'toast', role: 'status', 'aria-live': 'polite' }));
applyTheme(); applyKz(); wireSettings(); renderScores();
go(clamp(Number(S.slide) || 0, 0, SLIDES.length - 1));
